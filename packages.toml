version_regex = 'rstudio-([0-9]+\.[0-9]+\.[0-9]+-[0-9]+)-amd64\.deb'
version_sub = [["-", "."]]
checksum_regex = 'rstudio-[0-9]+\.[0-9]+\.[0-9]+-[0-9]+-amd64\.deb.*?([a-f0-9]{64})'
source_url_template = "https://download1.rstudio.org/electron/jammy/amd64/rstudio-{raw_version}-amd64.deb"
auto_push = true
upstream_url = "https://posit.co/download/rstudio-desktop/"

