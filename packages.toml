[rstudio-desktop-bin]
source = "website"
url = "https://www.rstudio.com/wp-content/downloads.json"
version_regex = '"basename": "rstudio-([0-9]+\.[0-9]+\.[0-9]+-[0-9]+)-amd64\.deb"'
version_sub = [["-", "."]]
checksum_regex = '"jammy".*?"sha256": "([a-f0-9]{64})"'
source_url_template = "https://download1.rstudio.org/electron/jammy/amd64/rstudio-{raw_version}-amd64.deb"
